version: '3.8'

services:
  # Backend service (uses MongoDB Atlas - no local MongoDB needed)
  backend:
    build: ./backend
    container_name: calculator-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - PORT=5000
    networks:
      - calculator-network

  # Frontend service
  frontend:
    build: ./frontend
    container_name: calculator-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - calculator-network

networks:
  calculator-network:
    driver: bridge
