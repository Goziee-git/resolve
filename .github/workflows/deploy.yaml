name: Deploy to AWS ECR

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types:
      - completed
    branches:
      - docker-lessons
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  GHCR_REGISTRY: ghcr.io
  BACKEND_REPOSITORY: calculator/backend
  FRONTEND_REPOSITORY: calculator/frontend

jobs:
  deploy-to-ecr:
    name: Deploy Docker Images to ECR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull backend image from GHCR
        run: |
          docker pull ${{ env.GHCR_REGISTRY }}/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/calculator-backend:latest

      - name: Tag and push backend image to ECR
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker tag ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/calculator-backend:latest $ECR_REGISTRY/${{ env.BACKEND_REPOSITORY }}:latest
          docker tag ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/calculator-backend:latest $ECR_REGISTRY/${{ env.BACKEND_REPOSITORY }}:${{ github.sha }}
          docker push $ECR_REGISTRY/${{ env.BACKEND_REPOSITORY }}:latest
          docker push $ECR_REGISTRY/${{ env.BACKEND_REPOSITORY }}:${{ github.sha }}

      - name: Pull frontend image from GHCR
        run: |
          docker pull ${{ env.GHCR_REGISTRY }}/$( echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/calculator-frontend:latest

      - name: Tag and push frontend image to ECR
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker tag ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/calculator-frontend:latest $ECR_REGISTRY/${{ env.FRONTEND_REPOSITORY }}:latest
          docker tag ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/calculator-frontend:latest $ECR_REGISTRY/${{ env.FRONTEND_REPOSITORY }}:${{ github.sha }}
          docker push $ECR_REGISTRY/${{ env.FRONTEND_REPOSITORY }}:latest
          docker push $ECR_REGISTRY/${{ env.FRONTEND_REPOSITORY }}:${{ github.sha }}

      - name: Deployment summary
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          echo "## Images deployed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${ECR_REGISTRY}/${{ env.BACKEND_REPOSITORY }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Backend (commit): \`${ECR_REGISTRY}/${{ env.BACKEND_REPOSITORY }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${ECR_REGISTRY}/${{ env.FRONTEND_REPOSITORY }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend (commit): \`${ECR_REGISTRY}/${{ env.FRONTEND_REPOSITORY }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

