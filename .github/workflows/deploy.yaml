name: Deploy to AWS ECR

on:
  workflow_run:
    workflows: ["Build and Push to GHCR"]
    types:
      - completed
    branches:
      - docker-lessons
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  id-token: write

env:
  GHCR_REGISTRY: ghcr.io
  AWS_REGION: us-east-1  # Change to your desired AWS region

jobs:
  deploy-to-aws-ecr:
    name: Pull from GHCR and Deploy to AWS ECR
    runs-on: ubuntu-latest

    steps:
      - name: Convert repository owner to lowercase
        id: lowercase-owner
        run: echo "OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull backend image from GHCR and push to AWS ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: calculator-backend
        run: |
          docker pull ${{ env.GHCR_REGISTRY }}/${{ steps.lowercase-owner.outputs.OWNER }}/calculator/backend:latest
          docker tag ${{ env.GHCR_REGISTRY }}/${{ steps.lowercase-owner.outputs.OWNER }}/calculator/backend:latest ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Pull frontend image from GHCR and push to AWS ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: calculator-frontend
        run: |
          docker pull ${{ env.GHCR_REGISTRY }}/${{ steps.lowercase-owner.outputs.OWNER }}/calculator/frontend:latest
          docker tag ${{ env.GHCR_REGISTRY }}/${{ steps.lowercase-owner.outputs.OWNER }}/calculator/frontend:latest ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deployment summary
        run: |
          echo "## Images deployed to AWS ECR" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${{ steps.login-ecr.outputs.registry }}/calculator/backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${{ steps.login-ecr.outputs.registry }}/calculator/frontend:latest\`" >> $GITHUB_STEP_SUMMARY
